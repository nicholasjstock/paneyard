# Paneyard as a herdr plugin: `herdr plugin install <owner>/paneyard`.
#
# The plugin is the whole Rails app. [[build]] downloads its matching Ruby
# runtime and production bundle into the managed checkout; the daemon keeps its
# databases, logs, generated secret and port in HERDR_PLUGIN_STATE_DIR, and
# reads the operator's settings from HERDR_PLUGIN_CONFIG_DIR/.env
# (`herdr plugin config-dir paneyard`). Every command goes through
# bin/herdr-plugin, which finds a suitable Ruby first.
# docs/herdr-plugin-plan.md has the design.
#
# herdr runs [[startup]] when its server starts, not on install or link, so
# every action also starts Paneyard if it is not running.

id = "paneyard"
name = "Paneyard"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Queue tasks for Claude Code or Codex; each runs in its own git worktree and herdr workspace."
platforms = ["macos", "linux"]

[[build]]
command = ["/bin/sh", "script/install_plugin_runtime"]

[[startup]]
command = ["/bin/sh", "bin/herdr-plugin", "startup"]

# --- actions: bind keys to these in herdr's config.toml (README) -------------

[[actions]]
id = "menu"
title = "Paneyard: menu"
description = "Open one Paneyard menu for queueing, runs, reports, sessions, layouts and setup."
contexts = ["workspace"]
command = ["/bin/sh", "bin/herdr-plugin", "pane", "menu"]

[[actions]]
id = "queue"
title = "Paneyard: queue a task here"
description = "Queue a task for an agent in this pane's repository, registering it as a workspace if needed."
contexts = ["workspace"]
command = ["/bin/sh", "bin/herdr-plugin", "pane", "queue"]

[[actions]]
id = "runs"
title = "Paneyard: runs"
description = "List runs; read a run's report, jump to its herdr workspace, close its session, or reopen a closed one."
contexts = ["workspace"]
command = ["/bin/sh", "bin/herdr-plugin", "pane", "runs"]

[[actions]]
id = "report"
title = "Paneyard: this run's report"
description = "Inside a run's herdr workspace: its newest report."
contexts = ["workspace"]
command = ["/bin/sh", "bin/herdr-plugin", "pane", "report"]

[[actions]]
id = "close"
title = "Paneyard: close this run's session"
description = "Inside a run's herdr workspace: quit its agent, close the workspace and free its slot (asks first)."
contexts = ["workspace"]
command = ["/bin/sh", "bin/herdr-plugin", "pane", "close"]

[[actions]]
id = "layout"
title = "Paneyard: edit this workspace's layout"
description = "Build and validate the current Paneyard workspace's tabs and panes in a Herdr popup."
contexts = ["workspace"]
command = ["/bin/sh", "bin/herdr-plugin", "pane", "layout"]

[[actions]]
id = "setup"
title = "Paneyard: configure coding agents"
description = "Detect installed coding agents and offer to connect them to Paneyard's MCP endpoint."
contexts = ["workspace"]
command = ["/bin/sh", "bin/herdr-plugin", "pane", "setup"]

[[actions]]
id = "mcp"
title = "Paneyard: configure coding agents"
description = "Alias for the setup action."
contexts = ["workspace"]
command = ["/bin/sh", "bin/herdr-plugin", "pane", "setup"]

[[actions]]
id = "mcp-url"
title = "Paneyard: print the MCP URL"
description = "Print /mcp/admin's URL to the plugin log and show it as a notification."
command = ["/bin/sh", "bin/herdr-plugin", "mcp-url"]

[[actions]]
id = "restart"
title = "Paneyard: restart"
description = "Restart Paneyard, to apply a change to its .env or a reinstall. Running sessions are not affected."
command = ["/bin/sh", "bin/herdr-plugin", "restart"]

[[actions]]
id = "stop"
title = "Paneyard: stop"
description = "Stop Paneyard. Running sessions keep running; any action starts it again."
command = ["/bin/sh", "bin/herdr-plugin", "stop"]

# --- popups behind the actions ----------------------------------------------

# The menu runs its choice in place (queue, runs, a report, the layout
# builder), so it needs the room those popups have.
[[panes]]
id = "menu"
title = "Paneyard"
placement = "popup"
width = "90%"
height = "80%"
command = ["/bin/sh", "bin/herdr-plugin", "menu-ui"]

[[panes]]
id = "queue"
title = "Paneyard: queue a task"
placement = "popup"
width = "80%"
height = "60%"
command = ["/bin/sh", "bin/herdr-plugin", "queue-ui"]

[[panes]]
id = "runs"
title = "Paneyard: runs"
placement = "popup"
width = "90%"
height = "80%"
command = ["/bin/sh", "bin/herdr-plugin", "runs-ui"]

[[panes]]
id = "report"
title = "Paneyard: report"
placement = "popup"
width = "90%"
height = "80%"
command = ["/bin/sh", "bin/herdr-plugin", "report-ui"]

[[panes]]
id = "close"
title = "Paneyard: close session"
placement = "popup"
width = "80%"
height = 16
command = ["/bin/sh", "bin/herdr-plugin", "close-ui"]

[[panes]]
id = "setup"
title = "Paneyard: configure coding agents"
placement = "popup"
width = "80%"
height = 20
command = ["/bin/sh", "bin/herdr-plugin", "mcp-ui"]

[[panes]]
id = "layout"
title = "Paneyard: edit workspace layout"
placement = "popup"
width = "90%"
height = "85%"
command = ["/bin/sh", "bin/herdr-plugin", "layout-ui"]

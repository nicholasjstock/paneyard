default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # RunDispatchJob, the reconcilers and the Telegram poller: all short,
    # frequent jobs.
    - queues: default
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# The long-running instance (bin/service -> bin/production) keeps its real
# state in storage/production*.sqlite3 in the main checkout.
#
# WORKFLOW_STORAGE_DIR moves all four files elsewhere: bin/sandbox and
# bin/preflight boot production code against scratch copies this way. Unset,
# the paths are exactly storage/production*.sqlite3.
<% storage_dir = ENV.fetch("WORKFLOW_STORAGE_DIR", "storage") %>
production:
  primary:
    <<: *default
    database: <%= storage_dir %>/production.sqlite3
  cache:
    <<: *default
    database: <%= storage_dir %>/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= storage_dir %>/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= storage_dir %>/production_cable.sqlite3
    migrations_paths: db/cable_migrate

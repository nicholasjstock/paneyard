<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow State Console</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Workflow Orchestrator</p>
          <h1>State Console</h1>
          <p class="lede">
            Routeable workflow operations surface for runs, workers, questions, events, and orchestrator ticks.
          </p>
        </div>
        <div class="hero-meta">
          <div class="meta-card">
            <span class="meta-label">Source</span>
            <code id="source-url">Loading…</code>
          </div>
          <div class="meta-card">
            <span class="meta-label">Updated</span>
            <strong id="generated-at">Waiting…</strong>
          </div>
          <div class="meta-card">
            <span class="meta-label">Route</span>
            <strong id="route-label">Overview</strong>
          </div>
          <div class="meta-card">
            <span class="meta-label">Stream</span>
            <strong id="stream-status">Connecting…</strong>
            <span id="stream-last-event" class="meta-subtle">No events yet</span>
          </div>
          <button id="refresh-button" class="refresh-button" type="button">Refresh now</button>
        </div>
      </header>

      <section id="banner" class="banner hidden"></section>

      <div class="app-grid">
        <aside class="sidebar panel">
          <div class="panel-header">
            <div>
              <p class="panel-kicker">Browse views</p>
              <h2>Surfaces</h2>
            </div>
          </div>
          <nav id="nav-links" class="nav-links"></nav>
          <div class="divider"></div>
          <div id="sidebar-summary" class="stack"></div>
        </aside>

        <section class="content-column">
          <section id="stats-grid" class="stats-grid"></section>
          <section id="view-shell" class="view-shell"></section>
        </section>
      </div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
  </html>
